name: Auction server CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pom.xml'
      - 'auction-server/**'
      - '.github/workflows/maven.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'pom.xml'
      - 'auction-server/**'
      - '.github/workflows/maven.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp -pl auction-server -am clean package -DskipTests
