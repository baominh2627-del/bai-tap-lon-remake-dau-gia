name: Deploy auction web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site/web
          cp index.html _site/
          cp web/style.css web/app.js web/config.js web/logo_new.png web/shield.png _site/web/
          if [ -d uploads ]; then cp -R uploads _site/uploads; fi
      - name: Upload web client
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
